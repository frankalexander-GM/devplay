# ============================================
# DevPlay - Configuración Nixpacks para Coolify
# ============================================
# Coolify usa Nixpacks para auto-detectar cómo construir
# la app. Este archivo le da instrucciones explícitas.
# ============================================

[phases.setup]
nixPkgs = ['nodejs_20', 'bun', 'openssl']

[phases.install]
cmds = [
  'bun install --frozen-lockfile',
  'bunx prisma generate'
]

[phases.build]
cmds = [
  'bun run build'
]

[phases.start]
# El comando que inicia la app
cmd = 'sh -c "bunx prisma db push --accept-data-loss && bun .next/standalone/server.js"'

# Variables de entorno que Coolify debe inyectar
[variables]
NODE_ENV = 'production'
PORT = '${PORT}'
HOSTNAME = '0.0.0.0'
