# ============================================================
# DevPlay Spring Boot API - Configuracion principal
# Documentacion: https://spring.enlinea.sbs/
# ============================================================

# ---------- Base de datos PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devplay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update crea/actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgMjU2IGJpdHMgbWluaW11bQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Servidor ----------
server.port=${PORT:8080}

# ---------- Jackson ----------
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Bogota
