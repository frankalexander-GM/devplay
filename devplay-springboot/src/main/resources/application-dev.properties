# ============================================================
# DevPlay Spring Boot API - Perfil de desarrollo
# Activa con: --spring.profiles.active=dev
# ============================================================

# ---------- Base de datos (dev local) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devplay_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA: en desarrollo regenera el esquema ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Logging detallado ----------
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
logging.level.com.devplay=debug
logging.level.org.springframework.security=debug

# ---------- JWT (clave de desarrollo) ----------
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgMjU2IGJpdHMgbWluaW11bQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Servidor ----------
server.port=${PORT:8080}
