# ============================================
# DevPlay — docker-compose para Coolify 🐳
# ============================================
# Dos servicios: web (Next.js :3000) + realtime (socket.io :3003).
# La base de datos es Supabase (externa) — no hay contenedor de DB.
#
# En Coolify: crea UN servicio tipo Docker Compose y define estas
# variables de entorno (panel → Environment):
#   DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL, REALTIME_SECRET,
#   SMTP_USER, SMTP_PASS, MAIL_FROM (+ opcionales ver DEPLOY-COOLIFY.md)
# ============================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - REALTIME_SECRET=${REALTIME_SECRET}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-DevPlay <devplay.online@gmail.com>}
      # Para avisar al realtime dentro de la red de compose
      - REALTIME_INTERNAL_URL=http://realtime:3004
      # Reenvío del chat (rewrites de Next leen esto en runtime)
      - REALTIME_PROXY_URL=http://realtime:3003
    depends_on:
      - realtime
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  realtime:
    build:
      context: .
      dockerfile: mini-services/realtime-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # MÍNIMO MISMO secreto que el backend — valida los tokens firmados 🔐
      - REALTIME_SECRET=${REALTIME_SECRET}
      - REALTIME_INTERNAL_HOST=0.0.0.0
    healthcheck:
      # ⚠️ GET / en engine.io responde 400 "Transport unknown" — el healthcheck
      # debe ser el HANDSHAKE de socket.io (EIO=4 + transport=polling)
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3003/socket.io/?EIO=4&transport=polling'); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
